<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>
        Variable learn
    </h1>
    <p Id="demo">


    </p>
    <script>
    let carName="volvo"
    let model="2012"

    document.getElementById("demo").innerHTML=`${carName} ,${model}`;
   </script>
</body>
</html>
