<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> Array</h1>
    <p id="demo"> </p>

<script>

<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> unshift
        <p id="demo"> </p>
        <script>
            const color=["red","yellow","blck","white"];
            color.unshift("pink");
            document.getElementById("demo").innerHTML=color;
        </script>
    </h1>
    
</body>
