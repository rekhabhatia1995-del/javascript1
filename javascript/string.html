<!DOCTYPE html>

    <meta charset="UTF-8">

</head>
<body>
    <h1> index of()</h1>
    <p id="demo"> </p>
    <script>
        let text="my name is rekha i am a front end developer";
        let index = text.indexOf("front");
        document.getElementById("demo").innerHTML=index;
    </script>

    
</body>
